services:
  expense-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-tracker
    restart: unless-stopped

    # Only accessible from the VM itself or through an SSH tunnel.
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      API_BASE_URL: http://127.0.0.1:8000
      EXPENSE_API_URL: http://127.0.0.1:8000
      TZ: Asia/Colombo

    volumes:
      - ./token.json:/app/token.json:rw
      - ./credentials.json:/app/credentials.json:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 200M
