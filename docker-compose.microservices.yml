services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-bot
    restart: unless-stopped
    command: ["python", "-m", "app.telegram_bot"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-scheduler
    restart: unless-stopped
    command: ["python", "-m", "app.automation.scheduler"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    volumes:
      - ./token.json:/app/token.json:rw
      - ./credentials.json:/app/credentials.json:ro

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense-mcp
    restart: unless-stopped
    command: ["python", "-m", "app.mcp_server"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
      - EXPENSE_API_URL=http://api:8000
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
    volumes:
      - ./token.json:/app/token.json:rw
      - ./credentials.json:/app/credentials.json:ro
